name: Bug report
description: Report a reproducible problem in POS Backend.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve POS Backend. Do not include private user data or credentials.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the route, sanitized request shape, and smallest reliable reproduction.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Backend revision or branch
      placeholder: Branch name or commit hash
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Add sanitized logs or responses. Remove sensitive fields first.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and private health, finance, nutrition, and profile data.
          required: true
