name: POS Backend CI

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pos_test
          POSTGRES_USER: pos_test
          POSTGRES_PASSWORD: pos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos_test -d pos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://pos_test:pos_test_password@127.0.0.1:5432/pos_test
      POS_TEST_DATABASE_URL: postgresql+psycopg://pos_test:pos_test_password@127.0.0.1:5432/pos_test
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Compile application source
        run: python -m compileall app

      - name: Validate application import
        run: python -c "from app.main import app"
